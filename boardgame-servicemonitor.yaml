apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: boardgame-servicemonitor
  namespace: monitoring   
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: boardgame       
  namespaceSelector:
    matchNames:
      - default            
  endpoints:
    - port: http           
      path: /actuator/prometheus
      interval: 30s
